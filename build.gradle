plugins {
    id 'eclipse'
    id 'idea'
    // Pinned instead of '[6.0,6.2)': the BMCLAPI mirror does not serve maven-metadata.xml,
    // and Gradle needs that file to resolve version ranges.
    id 'net.minecraftforge.gradle' version '6.0.26'
}

version = mod_version
group = mod_group_id
base.archivesName = 'create-fueling-imagination'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                creategourmetfood { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.named('jar', Jar).configure {
    manifest { attributes(['MixinConfigs': 'fuelingimagination.mixins.json']) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
